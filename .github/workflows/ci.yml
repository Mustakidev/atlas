name: CI

on:
  pull_request:
    branches:
      - production-hardening
  push:
    branches:
      - production-hardening

permissions:
  contents: read

concurrency:
  group: ph12-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-node v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run canonical tests
        env:
          ATLAS_LIVE_STATE_FILE_PATH: ${{ runner.temp }}/atlas-live-state.json
          ATLAS_LOG_FILE_PATH: ${{ runner.temp }}/atlas-events.jsonl
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          git ls-files -z -- '*.js' ':!**/node_modules/**' | while IFS= read -r -d '' file; do
            case "$file" in
              frontend/vendor/lightweight-charts-4.1.3/dist/lightweight-charts.standalone.production.js)
                continue
                ;;
            esac
            node --check "$file"
          done

      - name: Check JavaScript file modes
        shell: bash
        run: |
          unexpected=$(git ls-files -s -- '*.js' ':!**/node_modules/**' | awk '$1 != "100644" {print $4}')
          test -z "$unexpected"

      - name: Check repository cleanliness
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files backend/node_modules)"
          test -z "$(git ls-files verification-reports)"
          test ! -e backend/runtime-data
          test ! -e verification-reports
